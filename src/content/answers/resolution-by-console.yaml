id: resolution-by-console
question: "What resolution does it run at on my console?"
short: "PS5, PS5 Pro and Series X render at 1440p; Series S renders at about 720p and upscales to about 1080p. PS5 Pro adds PSSR upscaling and extra ray tracing."
body: |-
  - Source: Digital Foundry's comparison, repeated by TechPowerUp. Digital Foundry says Series S is the first Series console game to ship with FSR 4.
  - All platforms target 30 fps. See the frame rate card.
topic: settings
stage: hour-1
tier: none
consoles: all
byConsole:
  ps5: "The PS5 renders at 1440p and upscales to 4K without temporal upscaling, so it looks a little soft. PS5 Pro uses PSSR upscaling and adds extra ray-traced effects."
  xbox-x: "The Series X renders at 1440p and upscales to 4K without temporal upscaling, so it looks a little soft."
  xbox-s: "The Series S renders at about 720p and upscales to about 1080p with FSR 4. Digital Foundry says it keeps the main graphics features, at lower quality."
confidence: reported
