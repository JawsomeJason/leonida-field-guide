id: install-size-and-preload
question: "How big is it, and do I have space?"
short: "Up to 212 GB free, depending on your console. Pre-load opened 10 November: PS5 at midnight local time, Xbox at 12 a.m. GMT worldwide."
body: |-
  - Rockstar's wording is "up to 212 GB of available space depending on your device". It gives no per-console figures.
  - Boxed copies hold a download code. Rockstar says the code works for pre-loading as soon as you have it, and boxed copies were due at retailers from 12 November.
  - Short of room? See the storage card for where the game can live.
