id: install-size-and-preload
question: "How big is the game, and will it fit on my console?"
short: "Plan for up to 212 GB of free space, plus a little for updates. Check your console's free space before you start, and make room if you are short."
body: |-
  - Rockstar says the game needs "up to 212 GB of available space depending on your device". It gives no per-console figures.
  - Pre-load (download before launch) opened on 10 November. Boxed copies were due at retailers from 12 November.
  - Short of room? Open the "Make room" card for your console in Setup.
topic: setup
stage: before
tier: none
consoles: all
byConsole:
  ps5: "Plan for up to 212 GB free. It fits any PS5: the smallest has 825 GB of storage. To see your free space, go to Settings, then Storage. Short of room? See the Make room card."
  xbox-x: "Plan for up to 212 GB free. It fits a Series X, which has 1 TB. To see your free space: Xbox button, Profile & system, Settings, System, Storage devices. Short of room? See the Make room card."
  xbox-s: "Plan for up to 212 GB free. A 512 GB Series S can hold it, but not by much: some of the drive is reserved for the system. See the 512 GB card. To check space: Profile & system, Settings, System, Storage devices."
