id: avoid-spoilers
question: "How do I avoid spoilers?"
short: "Mute the game and its characters' names on X, YouTube and Reddit, turn off news alerts, and skip leaks and full-story videos, GTA Intel advises. It says the first 48 hours after launch are riskiest."
body: |-
  - X: Settings and privacy, Mute and block, Muted words. Apply it to the Home timeline and notifications. GTA Intel (checked 19 November) says muted words do not hide direct searches, so avoid searching the game name in launch week.
  - YouTube: GTA Intel says spoilers arrive in thumbnails and titles, and that a keyword-blocking browser extension can hide them from your feed.
  - Reddit: GTA Intel says its keyword filtering is weak, and that unfollowing the GTA subreddits until you finish is the reliable fix.
  - Mute busy Discord servers and group chats, and tell friends you are staying spoiler free.
  - Streams can hit a big moment without warning. This site shows no story content at the default setting.
