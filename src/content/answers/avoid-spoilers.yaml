id: avoid-spoilers
question: "How do I avoid spoilers?"
short: "Mute the game's name and its characters' names on X, YouTube and Reddit, turn off news and social notifications, and skip leak or full-story videos. The first 48 hours after launch are the riskiest."
body: |-
  - X: Settings and privacy, Mute and block, Muted words. Apply it to the Home timeline and notifications. It does not hide direct searches, so avoid searching the game name in launch week.
  - YouTube: spoilers arrive in thumbnails and titles. A keyword-blocking browser extension can hide them from your feed.
  - Reddit: its keyword filtering is weak. Unfollowing the GTA subreddits until you finish is the reliable fix.
  - Mute busy Discord servers and group chats, and tell friends you are staying spoiler free.
  - Streams can hit a big moment without warning. This site shows no story content at the default setting.
