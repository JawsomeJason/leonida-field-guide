id: will-i-lose-anything
question: "Will I lose my progress, saves or cash?"
short: "Deleting a game keeps what you bought, but saves for this game are not confirmed as backed up, so check first. You can lose in-game money. There is a simple way to keep it safe."
byConsole:
  ps5: "Deleting a game keeps what you bought. Saves for this game are not confirmed as backed up: upload them first (PlayStation Plus; Settings, Saved Data and Game/App Settings). You can lose in-game money. There is a simple way to keep it safe."
  xbox-x: "Deleting a game keeps what you bought. Xbox says saved games are copied online (synced) when you sign in. This game's backup is not confirmed: stay signed in until it syncs. You can lose in-game money. There is a simple way to keep it safe."
  xbox-s: "Deleting a game keeps what you bought. Xbox says saved games are copied online (synced) when you sign in. This game's backup is not confirmed: stay signed in until it syncs. You can lose in-game money. There is a simple way to keep it safe."
body: |-
  What we know
  - <span data-only="ps5">PlayStation's storage page says you do not lose access to a game you delete: you download your purchases again from your game library.</span><span data-only="xbox-x xbox-s">Xbox's storage page says removing a game does not remove your right to play (the licence), which stays in the cloud with your game progress.</span> Your saves are a separate matter.
  - <span data-only="ps5">PlayStation's own pages say PlayStation Plus members can upload saved data to online storage and have it copied automatically. That is about games in general; for this game, backup is not confirmed.</span><span data-only="xbox-x xbox-s">Xbox's own page says saved games are copied online (synced) when you sign in and come back when you reinstall a game. That is about games in general. Cultured Vultures reports that this game's Xbox listing shows saves kept online (cloud saves), but we have not seen that on an Xbox or Rockstar page, so for this game it is not confirmed.</span>
  - A saved game is separate from the game files. Before you delete, check your save is backed up: your console's steps are in [Are my saves backed up in the cloud?](/a/cloud-saves-and-backup/).
  - You can lose in-game money. There is a simple way to keep it safe.

  What we do not know
  - <span data-only="ps5">Whether this game backs up saves to PlayStation's online storage. Rockstar has not said.</span><span data-only="xbox-x xbox-s">Whether this game's Xbox saves kept online work as Cultured Vultures reports. Rockstar has not said.</span>
  - Whether the game saves by itself, and how many save slots there are. See [How do I save?](/a/how-to-save/).
  - Whether progress can move between console families. None has been announced.
