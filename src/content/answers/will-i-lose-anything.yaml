reveal:
  - tier: mild
    label: "Show how to keep it safe (one small game rule)"
    text: "Cash you carry is lost if you die before you deposit it at an ATM, and money in the bank is safe (Vice Atlas, before launch). Dying while you hold stash bags loses the bags and your cash on hand (GameSpot, after playing). Neither source says what happens on arrest, so we claim nothing there. To keep it safe, deposit it before you take risks."
