id: will-i-lose-anything
question: "Will I lose my progress, saves or cash?"
short: "Console makers say deleting a game keeps what you bought. Saves for this game are not confirmed as backed up, so check first. GameSpot reports carried cash can be lost: bank it before you take risks."
byConsole:
  ps5: "PlayStation says a deleted game can be downloaded again from your Game Library. Saved data for this game is not confirmed as backed up: upload it first with PlayStation Plus. Carried cash can be lost, GameSpot reports: bank it first."
  xbox-x: "Xbox says uninstalling keeps your licence and progress in the cloud, and saved data syncs online. Cloud saves for this game are reported, not confirmed: stay signed in and online until it syncs. Carried cash can be lost, GameSpot reports: bank it first."
  xbox-s: "Xbox says uninstalling keeps your licence and progress in the cloud, and saved data syncs online. Cloud saves for this game are reported, not confirmed: stay signed in and online until it syncs. Carried cash can be lost, GameSpot reports: bank it first."
body: |-
  What we know
  - Your console maker says deleting or uninstalling a game does not remove your right to play it. You download it again from your library.
  - A saved game is separate from the game files. Before you delete, check your save is backed up: your console's steps are in [Are my saves backed up in the cloud?](/a/cloud-saves-and-backup/).
  - Carried cash can be lost if you die. A report says money in the bank is safe, so bank it before you take risks. How that works sits behind the Mild setting.

  What we do not know
  - Whether this game backs up saves to the cloud on every console. Rockstar has not said.
  - Whether the game saves by itself, and how many save slots there are. See [How do I save?](/a/how-to-save/).
  - Whether progress can move between console families. None has been announced.
