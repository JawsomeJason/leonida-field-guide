reveal:
  - tier: mild
    text: "Cash you carry is lost if you die before you deposit it at an ATM, and money in the bank is safe (Vice Atlas, before launch). Dying while you hold loot bags loses the bags and your cash on hand (GameSpot, after playing). Neither source says what happens on arrest, so we claim nothing there."
