id: day-one-patches
question: "Is there a day-one patch, and how big is it?"
short: "Two updates reached pre-loaded copies: 01.002.000 (about 1 GB, from 13 November) and 01.002.001 (about 602.5 MB on PS5, about 1.6 GB on Xbox). Rockstar published no patch notes for either."
body: |-
  - The sizes come from console download prompts and press reports, not from Rockstar, Sony or Microsoft.
  - MakeTechEasier checked Rockstar's newswire and product page on 17 November and found no mention of either update.
  - gta6filesize.com estimates a bigger day-one patch of 15 to 50 GB. That is its own estimate, and Rockstar has not sized one.
