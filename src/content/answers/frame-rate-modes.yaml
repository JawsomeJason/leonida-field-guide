byConsole:
  ps5: "No 40 or 60 fps mode, not even on PS5 Pro: the game targets 30 fps. Digital Foundry found this. It reports PS5 Pro holds 30 fps, with brief drops to 24 in heavy explosions. A base PS5 drifts between 30 and the high 20s, and can reach the low 20s at worst."
  xbox-x: "No 40 or 60 fps mode: the game targets 30 fps. Digital Foundry found this. It reports a Series X drifts between 30 and the high 20s, dips to the mid 20s in heavy explosions and the low 20s at worst. Its camera lag measured about 180 ms, normal for a Rockstar 30 fps game."
  xbox-s: "No 40 or 60 fps mode: the game targets 30 fps. Digital Foundry found this. It reports a Series S often sits in the mid to high 20s and drops to about 20 in heavy explosions. Input lag was measured on one console only: about 180 ms."
