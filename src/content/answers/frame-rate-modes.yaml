id: frame-rate-modes
question: "Is there a 60 fps or performance mode?"
short: "No. Every console targets 30 fps, with no 40 or 60 fps mode, not even on PS5 Pro. The menu has no resolution or frame-rate option."
body: |-
  - TechPowerUp says Rockstar confirmed the 30 fps target. We have not seen that on a Rockstar page.
  - Digital Foundry's testing: PS5 Pro holds 30 fps nearly all the time, with brief drops to about 24 in heavy scenes. Base PS5 and Series X drift between 30 and the high 20s. Series S often sits in the mid to high 20s.
  - Turning on a 120 Hz output does not unlock more frames. See the 120 Hz and VRR card.
