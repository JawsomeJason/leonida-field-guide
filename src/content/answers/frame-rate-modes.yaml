id: frame-rate-modes
question: "Is there a 60 fps or performance mode?"
short: "No console has a 40 or 60 fps mode; every one targets 30 fps. Digital Foundry found this."
body: |-
  - Input lag (the delay between moving the stick and the camera moving) was about 180 ms, similar to other Rockstar 30 fps games. Digital Foundry measured it on one console, with a wireless controller, plus about 10 ms of delay in the display. It did not change at 60 Hz, 120 Hz or 120 Hz VRR.
  - TechPowerUp says Rockstar confirmed the 30 fps target. We have not seen that on a Rockstar page.
  - Turning on a 120 Hz output does not unlock more frames. More in [Do 120 Hz or VRR help?](/a/hz-and-vrr/).
