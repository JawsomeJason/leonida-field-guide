byConsole:
  ps5: "No. The game targets 30 fps, with no 40 or 60 fps mode, not even on PS5 Pro. Digital Foundry: PS5 Pro holds 30 fps nearly always. A base PS5 drifts between 30 and the high 20s in busy scenes."
  xbox-x: "No. The game targets 30 fps, with no 40 or 60 fps mode. Digital Foundry: a Series X drifts between 30 and the high 20s in busy scenes, and can dip into the mid 20s when a lot is exploding."
  xbox-s: "No. The game targets 30 fps, with no 40 or 60 fps mode. Digital Foundry: a Series S often sits in the mid to high 20s, and can dip further in heavy scenes."
