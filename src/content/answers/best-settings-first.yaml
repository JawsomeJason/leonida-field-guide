id: best-settings-first
question: "What are the best settings to change first?"
short: "Run HDR (extra-bright picture) calibration, set Motion Blur Strength to 0 and Camera Shake off if they bother you, turn Subtitles on, and pick your aiming help. One guide's advice; Rockstar has not published a settings guide."
body: |-
  Display
  - Run your console's HDR calibration first, then the in-game HDR calibration.
  - Motion Blur Strength: slide it to 0 (Display tab).
  - Safe Zone: pull the HUD (the on-screen display) inward if your TV cuts off the minimap or money counter.

  Camera and gameplay
  - Camera Shake: switch it off (Camera tab).
  - Subtitles start on a limited default. Switch them to On if you miss lines during action.
  - Targeting starts on Partial. The other modes are covered in [auto-aim and manual aim](/a/aiming-options/).
  - This guide suggests Minimap and Compass (Dynamic) for a first run.
