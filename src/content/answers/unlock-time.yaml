id: unlock-time
question: "When does it unlock in my region?"
short: "Rockstar: midnight local time on 19 November in every region. If your console still shows a countdown, that is your exact time."
body: |-
  - Past that time and still locked: [The game crashes or will not start. What do I do?](/a/crashes-and-launch-problems/)
  - Rockstar's support page says the game releases at "midnight local time on November 19, 2026, in all regions".
  - A news report says US times differ, and Rockstar's page gives no US breakdown. The report, with its outlet named and linked, is in [When does it unlock in each US time zone?](/a/unlock-time-us-zones/).
  - Your console's countdown is the final word. Past your time and still locked? See [The game crashes or will not start](/a/crashes-and-launch-problems/).
  - The title of Rockstar's page uses the word for downloading the game before launch (pre-load).
