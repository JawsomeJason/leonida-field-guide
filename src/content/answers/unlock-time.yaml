id: unlock-time
question: "When does it unlock in my region?"
short: "Rockstar: midnight local time on 19 November in every region. Check your console's countdown for your exact time."
body: |-
  - Rockstar's support page says the game releases at "midnight local time on November 19, 2026, in all regions".
  - In the US? A news report gives earlier times for the western time zones. Rockstar has not confirmed it, so it has its own card: [When does it unlock in each US time zone?](/a/unlock-time-us-zones/).
