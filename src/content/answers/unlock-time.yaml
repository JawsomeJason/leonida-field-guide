id: unlock-time
question: "When does it unlock in my region?"
short: "Rockstar: midnight local time on 19 November in every region. Forbes reports US stores key off Eastern time, so western US players may start the evening before. Check your console's countdown."
body: |-
  Where sources disagree
  - Rockstar's support page says the game releases at "midnight local time on November 19, 2026, in all regions".
  - Forbes (12 November) says US storefronts treat the country as one region on Eastern time, so a Hawaii player could unlock at 7 p.m. on 18 November. Forbes says Rockstar has not posted a US time-zone breakdown, and we found none either.
