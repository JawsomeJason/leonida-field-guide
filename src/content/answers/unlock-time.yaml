id: unlock-time
question: "When does it unlock in my region?"
short: "Rockstar: midnight local time on 19 November in every region, on both consoles. Forbes reports US stores key off Eastern time, so western US players may start the evening before. Check your console's countdown."
body: |-
  Where sources disagree
  - Rockstar's support page says "midnight local time on November 19, 2026, in all regions" for PS5 and Xbox Series X|S.
  - Forbes (12 November) says US storefronts treat the country as one region on Eastern time, so a Hawaii player could unlock at 7 p.m. on 18 November. We could not confirm that on a Rockstar page.
  - Output Lag quotes Microsoft's pre-order FAQ: play starts "usually shortly after 12:00 AM local time", and in countries with several time zones "there may be a delay in some zones".

  What to do
  - On PS5, the game in your Game Library shows a countdown timer until it unlocks.
  - Output Lag says a pre-loaded game that will not start on the evening before launch is not broken. It is still locked.
