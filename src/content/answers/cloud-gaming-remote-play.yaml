id: cloud-gaming-remote-play
question: "Can I stream it or use Remote Play?"
short: "Remote Play is fully supported on your console. Streaming the game from the cloud depends on your console."
body: |-
  - Rockstar warns that connection speed and other technical factors may affect performance in ways local play would not.
topic: setup
stage: before
tier: none
consoles: all
byConsole:
  ps5: "Remote Play is fully supported on PS5, so you can play your PS5 game on another screen. Rockstar lists no cloud streaming for PS5."
  xbox-x: "Xbox Cloud Gaming can stream it to Xbox Series X|S and Xbox One consoles. You must own the game and have cloud playtime. Remote Play is also fully supported."
  xbox-s: "Xbox Cloud Gaming can stream it to Xbox Series X|S and Xbox One consoles. You must own the game and have cloud playtime. Remote Play is also fully supported."
