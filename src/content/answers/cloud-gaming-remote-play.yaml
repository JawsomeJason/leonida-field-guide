id: cloud-gaming-remote-play
question: "Can I stream it or use Remote Play?"
short: "Rockstar says the game fully supports Remote Play (playing your console's game on another screen). Streaming it from the cloud depends on your console."
body: |-
  - Rockstar warns that connection speed and other technical factors may affect performance in ways local play would not.
topic: setup
stage: before
tier: none
consoles: all
byConsole:
  ps5: "Rockstar says Remote Play is fully supported on PS5, and the PlayStation Store page lists it too, so you can play your PS5 game on another screen. Rockstar lists no cloud streaming for PS5."
  xbox-x: "In select regions, Xbox Cloud Gaming can stream it to Xbox Series X|S and Xbox One consoles. You must own the game, and streaming uses cloud playtime from Game Pass or a purchase, or ad-supported cloud gaming. Rockstar says Remote Play is also fully supported."
  xbox-s: "In select regions, Xbox Cloud Gaming can stream it to Xbox Series X|S and Xbox One consoles. You must own the game, and streaming uses cloud playtime from Game Pass or a purchase, or ad-supported cloud gaming. Rockstar says Remote Play is also fully supported."
confidence: official
