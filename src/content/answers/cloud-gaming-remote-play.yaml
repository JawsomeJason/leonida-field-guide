id: cloud-gaming-remote-play
question: "Can I stream it or use Remote Play?"
short: "Xbox Cloud Gaming will carry it on Xbox Series X|S and Xbox One consoles, using Series S graphics settings. Remote Play is fully supported on PlayStation and Xbox consoles."
body: |-
  - Rockstar warns that connection speed and other technical factors may affect performance in ways local play would not.
  - Notebookcheck's scam roundup says cloud streaming at launch is for Xbox consoles, not PCs.
