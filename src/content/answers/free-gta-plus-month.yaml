id: free-gta-plus-month
question: "How do I claim the free GTA+ month, and will it renew?"
short: "Redeem it in your console's store. It auto-renews monthly at the regular price until you cancel."
body: |-
  - Only digital purchases before 20 November 2026 get it.
  - One redemption per platform account. A refund and re-order does not earn a second month.
  - Existing GTA+ members get the month added to their subscription.
