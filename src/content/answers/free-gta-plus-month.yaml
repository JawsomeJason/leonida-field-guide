  xbox-x: "Redeem it in Offers & Credits in the Microsoft Store within 180 days of buying. It auto-renews monthly at the regular price until you cancel."
  xbox-s: "Redeem it in Offers & Credits in the Microsoft Store within 180 days of buying. It auto-renews monthly at the regular price until you cancel."
