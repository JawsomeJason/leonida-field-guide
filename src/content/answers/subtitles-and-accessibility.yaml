id: subtitles-and-accessibility
question: "What accessibility and subtitle options are there?"
short: "KeenGamer reports subtitles can be resized and given a background, and that Tap Assist, Hold Assist and hold-to-toggle are in the Gameplay tab."
body: |-
  - Subtitles start on a limited default. Switch them to On to catch lines during gunfire, calls and loud radio.
  - Tap Assist makes one press count as two, three or four. Hold Assist swaps repeated presses for a hold.
  - Dialogue is English only, per KeenGamer.
