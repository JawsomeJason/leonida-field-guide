id: ps5-system-update
question: "Do I need a PS5 system update to play?"
short: "Reportedly yes. PlayStation Support said a PS5 system software update is required before playing, and to install it before launch. Launch day has come, so install it now if you have not. We could not confirm the version."
body: |-
  - Kotaku quotes a PlayStation Support post from 17 November. We did not open the post.
  - Update from Settings, System, System Software, System Software Update and Settings.
  - Neither Kotaku nor we know what the update changes.
