id: stolen-cars
question: "How do vehicles and stealing cars work?"
short: "Some cars are harder to steal than others, and a phone app lists what buyers want and each car's security, Crime Net Gazette reports. It comes from pre-launch reporting."
body: |-
  - Crime Net Gazette wrote this before launch. It says it is not an established money-making strategy yet.
  - Expensive cars can broadcast their location to police, and buyers' drop-offs reportedly have signal blockers. A wrecked car sells for less. This is a pre-launch report, not tested in the game.
