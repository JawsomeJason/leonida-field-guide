id: error-codes-and-ownership
question: "What do I do about sign-in, storage or ownership error codes?"
short: "Rockstar sends you to your console maker's error-code lookup. For purchases and downloads, it points to the console makers' support pages."
body: |-
  - Rockstar's error page (updated 18 November) lists no codes of its own.
  - For a stuck download, see the download card for your console in Fixes.
