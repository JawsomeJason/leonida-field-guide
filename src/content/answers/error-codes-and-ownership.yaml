id: error-codes-and-ownership
question: "What do I do about sign-in, storage or ownership error codes?"
short: "Rockstar sends you to your console maker's error-code lookup. For purchases and downloads, it points to the console makers' support pages."
body: |-
  - Rockstar's error page (updated 18 November) lists no codes of its own.

  <span data-only="ps5">For a stuck download, [follow the steps for your console](/a/ps5-download-stuck/).</span><span data-only="xbox-x xbox-s">For a stuck download, [follow the steps for your console](/a/xbox-download-stuck/).</span>
topic: fixes
stage: hour-1
tier: none
consoles: all
byConsole:
  ps5: "Rockstar sends you to PlayStation's PS5 error-code lookup (playstation.com/support/error-codes/ps5). For purchases and downloads, it points to PlayStation Support."
  xbox-x: "Rockstar sends you to Xbox's error-code search (support.xbox.com/help/errors/error-code-search-guide). For purchases and downloads, it points to Xbox Support."
  xbox-s: "Rockstar sends you to Xbox's error-code search (support.xbox.com/help/errors/error-code-search-guide). For purchases and downloads, it points to Xbox Support."
