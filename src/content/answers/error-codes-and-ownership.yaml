id: error-codes-and-ownership
question: "What do I do about sign-in, storage or ownership error codes?"
short: "Rockstar sends you to PlayStation's PS5 error-code lookup or Xbox's error-code search. For purchases and downloads, it points to the console makers' support pages."
body: |-
  - Rockstar's error page (updated 18 November) lists no codes of its own.
  - Our Xbox "you don't own it" card covers the most common ownership message.
  - For stuck downloads, see the PS5 and Xbox download cards.
