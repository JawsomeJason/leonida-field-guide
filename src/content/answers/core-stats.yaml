id: core-stats
question: "What are the core stats and how do I raise them?"
short: "Three stats: Health, Stamina and Focus. GameSpot lists them and says training raises them, and eating, sleeping and showering give temporary boosts."
body: |-
  - Weights raise Health. Running, biking and kayaking raise Stamina. Calm activities such as fishing and pool raise Focus.
  - Focus controls how long you can slow time. Click both sticks to use it.
  - The boosts from eating, sleeping and showering last until you die or end the session. GameSpot says gains from training fade if you stop. Skipping the routine will not ruin the game, but it puts you at a disadvantage.
