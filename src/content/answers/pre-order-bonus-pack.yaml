id: pre-order-bonus-pack
question: "Who gets the Vintage Vice City Pack?"
short: "Digital pre-orders and purchases of either edition before 20 November 2026 include the Vintage Vice City Pack and a free month of GTA+. Boxed copies list the pack but not the GTA+ month."
body: |-
  - The pack is a car with a garage, outfits and hairstyles, and a weapon pattern.
  - Rockstar's physical list names one code for the game and the pack. It does not list GTA+.
  - Rockstar's newswire was showing "Last Chance for Pre-Order Bonuses" on launch day.
  - The title of Rockstar's page uses the word for downloading the game before launch (pre-load).
