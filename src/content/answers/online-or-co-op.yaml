id: online-or-co-op
question: "Is there online or co-op at launch?"
short: "No. The game is single-player, and no online or co-op mode is listed."
byConsole:
  ps5: "No. The PlayStation Store page calls the game a single-player experience and lists 1 player with offline play."
  xbox-x: "No. The Xbox store page calls the game a single-player experience."
  xbox-s: "No. The Xbox store page calls the game a single-player experience."
body: |-
  - <span data-only="ps5">The PlayStation Store page says it in its FAQ, in the answer to a question about multiplayer modes, and its listing shows 1 player and offline play.</span><span data-only="xbox-x xbox-s">The Xbox store page says it in a note at the foot of the page.</span> That page lists no online or co-op mode.
  - Rockstar's service status page lists its online services but has no separate row for this game.
  - If an online mode is announced, this card will change.
