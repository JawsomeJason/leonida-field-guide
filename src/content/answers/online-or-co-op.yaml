id: online-or-co-op
question: "Is there online or co-op at launch?"
short: "Two guides say the console store listings describe it as single-player, and Rockstar's launch pages list no online or co-op mode."
body: |-
  - Output Lag quotes the console store listings as calling it "a single-player experience". Cultured Vultures says the Xbox listing identifies it as a single-player game.
  - Rockstar's service status page, checked on launch day, lists its online services but has no separate row for this game.
  - If Rockstar announces an online mode, this card will change.
