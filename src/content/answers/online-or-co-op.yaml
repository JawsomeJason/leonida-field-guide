id: online-or-co-op
question: "Is there online or co-op at launch?"
short: "No online or co-op mode is listed for launch. The game is described as a single-player experience."
body: |-
  - We read two console store pages. One calls the game "a single-player experience"; the other lists no online or co-op feature.
  - Rockstar's service status page lists its online services but has no separate row for this game.
  - If an online mode is announced, this card will change.
