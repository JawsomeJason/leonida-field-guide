id: free-space-xbox
question: "Make room: how do I check free space and clear space on my Xbox?"
short: "Xbox button, then Profile & system, Settings, System, Storage devices shows free space. To make room, move games to an external drive, or uninstall ones you do not play: check saved games are backed up first."
body: |-
  - Xbox says uninstalling keeps your right to play (your licence), so you can download the game again. For saved data, see [Will I lose anything?](/a/will-i-lose-anything/)
  - When the drive is getting full, Xbox's smart storage points out games that are good to remove.
  - You will never see the whole drive free. Microsoft says some of it is reserved for saved games and system files.
  - Microsoft's rule: games built for the newer Xbox hardware (the store label is Optimized for Series X|S) must be installed on the console's internal SSD (its drive) or on a Storage Expansion Card (a plug-in drive sold separately). An external USB drive can only park them: move a game back to play it. We have not confirmed this game's label, so plan on that rule.
  - An external drive must hold 128 GB or more and connect by USB 3.0 or newer. Moving a game there instead of deleting it saves a re-download.
