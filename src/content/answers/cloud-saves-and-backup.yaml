id: cloud-saves-and-backup
question: "Are my saves backed up in the cloud?"
short: "Cloud backup depends on your console. Progress shared between consoles (cross-progression) has not been announced, so assume saves stay within your console family."
body: |-
  - Rockstar has not announced shared progress between consoles.
  - Assume saves stay within your console family.
  - For installs, saves and cash together, see [Will I lose anything?](/a/will-i-lose-anything/).
