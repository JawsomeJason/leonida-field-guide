byConsole:
  ps5: "Not confirmed for this game. With PlayStation Plus you can upload saved data yourself: Settings, Saved Data and Game/App Settings, Saved Data (PS5), then Upload or Delete from Console Storage. Treat your save as local until Rockstar says more."
  xbox-x: "Reported as supported: Cultured Vultures says the Xbox listing shows cloud saves, and they should sync between your Xbox consoles on one account. We could not read that on the listing ourselves. Xbox says saves sync while you are connected, and playing offline can leave the online copy out of date: stay online before you uninstall."
  xbox-s: "Reported as supported: Cultured Vultures says the Xbox listing shows cloud saves, and they should sync between your Xbox consoles on one account. We could not read that on the listing ourselves. Xbox says saves sync while you are connected, and playing offline can leave the online copy out of date: stay online before you uninstall."
