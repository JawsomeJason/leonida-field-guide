id: cloud-saves-and-backup
question: "Are my saves backed up in the cloud?"
short: "Xbox: cloud saves are reported as supported. PS5: not confirmed. PS5 owners may be able to use PlayStation Plus cloud storage. No cross-progression between PS5 and Xbox has been announced."
body: |-
  - Cultured Vultures also says there is no Xbox Play Anywhere, and no PC version has been announced.
  - Rockstar has not announced a Social Club save move or shared progress.
  - Assume saves stay within your console family.
