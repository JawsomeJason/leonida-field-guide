id: missing-or-rejected-code
question: "My code or pre-order bonus is missing or rejected. What do I do?"
short: "Check you redeemed it on the right store account. If a box had no code or a code fails, go back to where you bought it: Rockstar points store purchases to PlayStation or Xbox Support, and retail purchases to the retailer."
body: |-
  Who to contact, per Rockstar
  - Bought on the PlayStation Store or Microsoft Store: PlayStation Support or Xbox Support.
  - Bought a physical copy from the Rockstar Store: Xsolla support (help.xsolla.com).
  - Bought anywhere else: the retailer.

  Good to know
  - Boxed copies hold a download code and no disc.
  - PS5 codes only work on accounts from the country group they were sold in. Xbox codes are not region-locked.
  - Notebookcheck reported on 14 November that some sealed boxes had no code inside. It said the problem did not look widespread, and that some buyers said their refund requests were refused.
