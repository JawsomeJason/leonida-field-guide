id: missing-or-rejected-code
question: "My code or pre-order bonus is missing or rejected. What do I do?"
short: "Check you redeemed the code on the account you play on. If a box had no code or the code fails, go back to where you bought it, or start with Rockstar's activation help."
body: |-
  Where to go next
  - [Rockstar's game activation help](https://support.rockstargames.com/articles/5gwDh0peG05GQhMej2ukbY/game-activation-for-grand-theft-auto-vi) covers a boxed copy or a gifted code, and links to your console maker's redeem page.
  - Still stuck? [Send Rockstar Support a request](https://support.rockstargames.com/request). They say they are available 24 hours a day.
  - Bought in your console's own store: contact that console maker's support.
  - Bought a physical copy from the Rockstar Store: Rockstar's [pre-order support FAQ](https://support.rockstargames.com/articles/40DHWEDBnq5jUuWJqKcH02/grand-theft-auto-vi-pre-order-purchase-support-faq) says to contact Xsolla support (help.xsolla.com).
  - Bought anywhere else: the retailer.

  Good to know
  - Boxed copies hold a download code and no disc.
  - A sealed box with no code inside? Start with the shop, then Rockstar's activation help. A news report on this, with its outlet named, has its own card: [Some sealed boxes had no code inside](/a/boxed-copy-no-code/).
topic: bonuses
