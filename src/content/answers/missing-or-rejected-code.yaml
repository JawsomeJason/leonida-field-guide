byConsole:
  ps5: "Check you redeemed it on the PlayStation account you play on, and that it matches the code's country group. Bought in the PlayStation Store: contact PlayStation Support. Otherwise Rockstar's activation help is the next step."
  xbox-x: "Check you redeemed it on the Microsoft account you play on. An Xbox code is not tied to one country. Bought in the Microsoft Store: contact Xbox Support. Otherwise Rockstar's activation help is the next step."
  xbox-s: "Check you redeemed it on the Microsoft account you play on. An Xbox code is not tied to one country. Bought in the Microsoft Store: contact Xbox Support. Otherwise Rockstar's activation help is the next step."
