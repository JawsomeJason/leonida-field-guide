id: unlock-time-us-zones
question: "When does it unlock in each US time zone?"
short: "Go by your console's countdown. Forbes reports an earlier start in the western US (9 p.m. Pacific on 18 November), but Rockstar says midnight local time in every region, so the two sources disagree."
body: |-
  Forbes's table (12 November), as a news report:
  - Eastern: 12 a.m. Thursday 19 November
  - Central: 11 p.m. Wednesday 18 November
  - Mountain: 10 p.m. Wednesday 18 November
  - Pacific: 9 p.m. Wednesday 18 November
  - Alaska: 8 p.m. Wednesday 18 November
  - Hawaii: 7 p.m. Wednesday 18 November

  Which source says which: Forbes (above) says US stores key the unlock to Eastern time, so the west starts earlier. Rockstar's own page says "midnight local time" in all regions and gives no US time-zone breakdown, and we found none either. A console maker's pre-order help adds only that, in a country with several time zones, play can start late in some zones. Nobody official confirms the earlier times. Your console's countdown is the final word. See [When does it unlock in my region?](/a/unlock-time/).

  The title of Rockstar's page uses the word for downloading the game before launch (pre-load).
