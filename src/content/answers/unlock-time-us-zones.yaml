id: unlock-time-us-zones
question: "When does it unlock in each US time zone?"
short: "Forbes reports US stores key the unlock to Eastern time: 9 p.m. Pacific and 7 p.m. in Hawaii on 18 November. Rockstar has posted no US breakdown, so check your console's countdown."
body: |-
  Forbes's table (12 November), as a news report:
  - Eastern: 12 a.m. Thursday 19 November
  - Central: 11 p.m. Wednesday 18 November
  - Mountain: 10 p.m. Wednesday 18 November
  - Pacific: 9 p.m. Wednesday 18 November
  - Alaska: 8 p.m. Wednesday 18 November
  - Hawaii: 7 p.m. Wednesday 18 November

  Rockstar's own page says "midnight local time" in all regions and gives no US time-zone breakdown, and we found none either. Your console's countdown is the final word. See the unlock time card.
