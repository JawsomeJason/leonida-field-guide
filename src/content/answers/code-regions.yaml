id: code-regions
question: "Will my code work on my account's country?"
short: "Rockstar advises buying from a retailer in the country of your platform account. Some consoles lock a code to a country group; the rule differs by console."
body: |-
  - Region limits are based on the region tied to your platform account.
  - If you buy in a different region from your account, the version you buy has to match the account's region.
  - Rockstar's advice is to buy and play from a retailer in the country of your platform account, to avoid activation problems.

  <span data-only="ps5">Which accounts share a code: [Which countries share a PlayStation code group?](/a/code-regions-ps5/).</span>
topic: bonuses
stage: before
tier: none
consoles: all
byConsole:
  ps5: "PlayStation codes only work on accounts from the country group where the code was sold, for example Canada and the United States together, and the UK on its own. Buy from a store in your account's country."
  xbox-x: "Xbox codes are not limited to one country (region-locked). Rockstar still advises buying from a retailer in the country of your account, to avoid activation problems."
  xbox-s: "Xbox codes are not limited to one country (region-locked). Rockstar still advises buying from a retailer in the country of your account, to avoid activation problems."
