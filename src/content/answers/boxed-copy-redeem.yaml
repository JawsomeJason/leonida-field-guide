id: boxed-copy-redeem
question: "Does a boxed copy still need the full download?"
short: "Yes. A boxed copy holds a download code and no disc, so you still download the whole game. Redeem the code on the PlayStation Store or Xbox Store, then download."
body: |-
  - Rockstar: "A disc will not be included in the box." The code works for pre-loading as soon as you have it.
  - Redeeming, as Output Lag summarises Sony's and Microsoft's pages:
    - PS5 console: PlayStation Store, press the triangle button, More, Redeem Code. Online: your profile, Redeem Code.
    - Xbox console: Xbox button, Store, View button, Redeem. Online: xbox.com/redeem.
  - A code redeems to one account and cannot be moved. Use the account you will play on.
  - For Series S drive space, see the storage card.
