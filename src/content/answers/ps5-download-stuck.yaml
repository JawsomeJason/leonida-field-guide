id: ps5-download-stuck
question: "My PS5 download won't start or is stuck. What do I try?"
short: "Check PlayStation's status page, update the system software, then pause and resume the download. If it is still stuck, cancel, delete and download again. Safe Mode's Rebuild Database is the last resort."
body: |-
  Order to try, from Output Lag's summary of Sony's steps
  1. Check the PlayStation status page. Wait if there are alerts.
  2. Update: Settings, System, System Software, System Software Update and Settings.
  3. Downloads/Uploads in the control center: select the game, then Pause and Resume.
  4. Cancel and Delete, then download again from your Game Library.
  5. Check free space, and test the connection: Settings, Network, Connection Status.
  6. Last resort: start in Safe Mode and choose Clear Cache and Rebuild Database.

  Rockstar's install-issues page sends PS5 players to Sony's own troubleshooter and adds no steps.
