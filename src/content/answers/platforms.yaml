id: platforms
question: "Is it on PC, PS4 or Switch?"
short: "Only on PS5 and Xbox Series X|S. Rockstar's pages list no PC, PS4 or Switch version. Xbox One can stream it through Xbox Cloud Gaming."
body: |-
  - Rockstar's platforms page: "You can pre-order Grand Theft Auto VI for PlayStation 5 and XBOX Series X|S."
  - Rockstar's cloud gaming line covers Xbox Series X|S and Xbox One consoles. See the streaming card.
  - Any site offering a PC download is a scam. See the scams card.
