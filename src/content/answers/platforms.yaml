id: platforms
question: "Is it on PC, PS4 or Switch?"
short: "No. Rockstar lists only PS5 and Xbox Series X|S, with no PC, PS4 or Switch version."
body: |-
  - Rockstar lists no PC version, so treat any PC download offer as a red flag. See [Are 'GTA 6 PC download' and early-access offers real?](/a/pc-download-scams/).
  - The title of Rockstar's page uses the word for downloading the game before launch (pre-load).
