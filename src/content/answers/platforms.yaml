id: platforms
question: "Is it on PC, PS4 or Switch?"
short: "No. Rockstar lists only PS5 and Xbox Series X|S, with no PC, PS4 or Switch version."
body: |-
  - Any site offering a PC download is a scam. See [Are 'GTA 6 PC download' and early-access offers real?](/a/pc-download-scams/).
