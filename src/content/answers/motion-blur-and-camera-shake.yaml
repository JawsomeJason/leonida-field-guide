id: motion-blur-and-camera-shake
question: "How do I turn off motion blur and camera shake?"
short: "Settings, Display: drag Motion Blur Strength to 0. Settings, Camera: Camera Shake off. KeenGamer's guide says both help if fast camera moves make you queasy."
body: |-
  - KeenGamer says blur smears the picture on fast turns at a locked 30 fps.
  - It also suggests turning off your TV's motion smoothing.
  - Kill cam and crash cam options sit with the camera settings too.
