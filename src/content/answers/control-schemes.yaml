id: control-schemes
question: "Which control scheme should I use?"
short: "One guide lists three layouts: Default, Classic and Left-Handed. In Default, run is on L3, aim on L2 and shoot on R2. Hold D-pad Up for the phone."
body: |-
  - In a car with Default: the right trigger accelerates and the left trigger brakes and reverses.
  - Classic and Left-Handed move buttons around. We do not list them because the research behind this site found guides disagreeing on Classic.
  - The source's Xbox section reuses PlayStation face-button names, so we only give the Xbox trigger, bumper and stick mappings.
  - Rockstar has not published a control chart that we found. The in-game menu is the final word.
