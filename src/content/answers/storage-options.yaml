id: storage-options
question: "Where can I put the game if my drive is full?"
short: "Rockstar says up to 212 GB. PS5 games run only from internal storage or an M.2 SSD; Xbox optimized games from the internal drive or a Storage Expansion Card. USB drives only park them."
body: |-
  - Deleting a game does not remove your licence. You can download it again, and Microsoft says your progress stays in the cloud.
  - Moving a game to USB instead of deleting it saves a re-download.
  - The 209.86 GB and 225.3 GB figures are the same file: Microsoft's catalog lists 225,336,647,680 bytes.
  - Rockstar's only figure is "up to 212 GB".
topic: setup
stage: before
tier: none
consoles: all
byConsole:
  ps5: "A PS5 can only play games from its internal SSD or an M.2 SSD (PCIe Gen4, 250 GB to 8 TB). A USB drive stores PS5 games but cannot run them."
  xbox-x: "Xbox's store lists the game at about 209.86 GB. Optimized games must be installed on the internal SSD or a Storage Expansion Card; a USB drive only parks them."
  xbox-s: "Xbox's store lists the game at about 209.86 GB, and some of a 500 GB drive is reserved by the system. Optimized games must be on the internal SSD or a Storage Expansion Card."
