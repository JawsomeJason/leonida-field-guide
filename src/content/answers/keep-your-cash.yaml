id: keep-your-cash
question: "How do I keep my cash from being lost?"
short: "Money in the bank is safe. Cash you carry is lost if you die before depositing it at an ATM, and so is loot carried in bags. The sources do not say what happens on arrest."
body: |-
  - Both sources describe this for death. Neither covers being arrested, so we do not claim anything there.
  - Vice Atlas wrote before launch. GameSpot wrote after playing. They agree on the main rule.
  - Habit worth building: deposit after a big score, before you take risks.
