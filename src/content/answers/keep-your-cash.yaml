id: keep-your-cash
question: "How do I keep my cash from being lost?"
short: "GameSpot and Vice Atlas report that carried cash can be lost if you die. Bank it before you take risks: a report says banked money is safe. How money works sits behind Mild."
body: |-
  - For uninstalling and saved data, see [Will I lose my progress, saves or cash?](/a/will-i-lose-anything/).
topic: money
stage: day-1
tier: none
consoles: all
