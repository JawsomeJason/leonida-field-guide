checked: "2026-11-19"
rank: 10
reveal:
  - tier: mild
    text: "Vice Atlas (before launch) says cash on hand is lost if you die before you deposit it at an ATM, and that money in the bank is safe. GameSpot (after playing) says dying while you hold loot bags loses the bags and your cash on hand; it does not mention ATMs or the bank, so the deposit detail rests on Vice Atlas alone. Neither source covers being arrested, so we claim nothing there. Habit worth building: deposit after a big score, before you take risks."
keywords: ["lose cash", "lose my cash", "cash when i die", "lose money when i die"]
