id: keep-your-cash
question: "How do I keep my cash from being lost?"
short: "Money in the bank is safe. Cash you carry is lost if you die before depositing it at an ATM, and so is loot carried in bags. The sources do not say what happens on arrest."
body: |-
  - Vice Atlas (before launch) says cash on hand is lost if you die before you deposit it at an ATM, and that money in the bank is safe.
  - GameSpot (after playing) says dying while you hold loot bags loses the bags and your cash on hand. It does not mention ATMs or the bank, so the deposit detail rests on Vice Atlas alone.
  - Neither source covers being arrested, so we do not claim anything there.
  - Habit worth building: deposit after a big score, before you take risks.
