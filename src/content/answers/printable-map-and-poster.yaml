id: printable-map-and-poster
question: "Is there an official printable map and poster?"
short: "Rockstar said it would add a free printable cover poster and map of Leonida to its site on 19 November. A double-sided physical poster follows from the Rockstar Store, $0.99 or free with any store purchase."
body: |-
  - The physical version was due shortly after launch.
  - Rockstar's announcement is in its newswire post about downloading the game before launch (pre-load).
