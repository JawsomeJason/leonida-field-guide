id: printable-map-and-poster
question: "Is there an official printable map and poster?"
short: "Rockstar announced a free printable cover poster and map of Leonida for its site on launch day, 19 November, and a double-sided physical poster from the Rockstar Store shortly after launch ($0.99, or free with any store purchase)."
body: |-
  - Rockstar's newswire post of 3 November made the announcement. It is headed with news about downloading before launch; the map and poster are in its last paragraphs. We did not find the download on Rockstar's Downloads page on 19 November, so check there before relying on it.
  - The physical version was promised for shortly after launch.
  - The title of Rockstar's page uses the word for downloading the game before launch (pre-load).
