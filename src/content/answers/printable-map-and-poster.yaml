id: printable-map-and-poster
question: "Is there an official printable map and poster?"
short: "Rockstar announced a free printable cover poster and map of Leonida for its site on launch day, 19 November, and a double-sided physical poster from the Rockstar Store ($0.99, or free with any store purchase)."
body: |-
  - Rockstar's newswire post of 3 November made the announcement. It is headed with the pre-load news; the map and poster are in its last paragraphs. We did not find the download on Rockstar's Downloads page on 19 November, so check there before relying on it.
  - The physical version was promised for shortly after launch.
