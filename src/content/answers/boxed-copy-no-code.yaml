id: boxed-copy-no-code
question: "My sealed box had no code inside. What now?"
short: "Notebookcheck reported on 14 November that some sealed boxes had no code inside, for more than one console. It did not look widespread. Start with where you bought it, then Rockstar's activation help."
body: |-
  - The same report says some buyers who asked Rockstar or a shop for a refund were refused. This is a news report, not a Rockstar statement.
  - Where to go next: [My code or pre-order bonus is missing or rejected](/a/missing-or-rejected-code/).
