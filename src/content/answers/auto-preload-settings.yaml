id: auto-preload-settings
question: "How do I make the game download by itself?"
short: "PS5: turn on auto-downloads and leave the console on or in Rest Mode. Xbox: turn on automatic updates and leave it on or in Sleep mode."
body: |-
  - Rockstar's pre-load FAQ gives the PS5 and Xbox requirements above and links to each console maker's own steps.
  - Output Lag adds, from Sony's page: on PS5, also turn on Stay Connected to the Internet, then select the countdown timer on the game in your Game Library and tick the content you want downloaded.
  - If the automatic download did not happen, start it by hand from your library.
