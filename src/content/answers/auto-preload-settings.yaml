id: auto-preload-settings
question: "How do I make the game download by itself?"
short: "Turn on automatic downloads or updates, and leave the console on or in its rest or sleep mode."
body: |-
  - Rockstar's FAQ for downloading before launch (pre-load) gives the requirements for each console and links to the console maker's own steps.
  - <span data-only="ps5">If it did not start, see [My PS5 download won't start or is stuck](/a/ps5-download-stuck/).</span><span data-only="xbox-x xbox-s">If it did not start, see [My Xbox download won't start, is slow, or is stuck at Queued](/a/xbox-download-stuck/).</span>
topic: setup
stage: before
tier: none
consoles: all
byConsole:
  ps5: "Turn on auto-downloads and leave the PS5 on or in Rest Mode. Then select the countdown timer on the game in your Game Library and follow the on-screen steps."
  xbox-x: "Turn on automatic updates and leave the console on or in Sleep mode."
  xbox-s: "Turn on automatic updates and leave the console on or in Sleep mode."
confidence: official
