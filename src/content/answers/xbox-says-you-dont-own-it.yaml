id: xbox-says-you-dont-own-it
question: "Xbox says I don't own the game. What now?"
short: "Per Microsoft, as quoted by Output Lag: the pre-order was either canceled or the payment failed in time. Check your order history first. If the Store shows a price instead of Install, do not buy again."
body: |-
  - Microsoft charges card pre-orders about 10 days before release and retries once a few days later. If both fail, the pre-order is canceled and you need to buy again.
  - If the purchase went through, the Store shows Install and you will not pay twice.
  - Output Lag quotes Microsoft. We did not open Microsoft's page.
