id: how-to-save
question: "How do I save, and how many slots are there?"
short: "Save by hand from the main menu: Game, then Save Game (reported, not confirmed by Rockstar). A PC Gamer guide reports 15 manual slots; no Rockstar page confirms the number."
body: |-
  - PC Gamer's guide gives the menu path and the 15-slot figure. It is a news guide, not a Rockstar page.
  - GameSpot advises saving by hand often. Progress moves on, and you cannot go back to an older state without a manual save (a hard save).
  - No Rockstar page we read gives a slot count or describes autosave. For backups, see [Are my saves backed up in the cloud?](/a/cloud-saves-and-backup/).
