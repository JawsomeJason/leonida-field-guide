id: early-unlock-trick
question: "Is it safe to change my console's region to play early?"
short: "Not recommended. Notebookcheck reports that a console maker reportedly warned against it and that it could risk account restrictions. Rockstar says the game opens at midnight local time everywhere."
body: |-
  - Notebookcheck says region switching technically goes against a console maker's terms of service. That is the outlet's reading; its report says the maker only allegedly warned journalists, and we have not seen the platform say it.
  - Rockstar's own page says midnight local time in every region. For when that is, see [When does it unlock in my region?](/a/unlock-time/).
  - The title of Rockstar's page uses the word for downloading the game before launch (pre-load).
