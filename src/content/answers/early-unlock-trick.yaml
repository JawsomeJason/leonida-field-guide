id: early-unlock-trick
question: "Is it safe to change my console's region to play early?"
short: "Not recommended. Region switching breaks the platform's terms, the console maker reportedly warned against it, and Rockstar is said to be watching. Bans are reported to be rare, but streamers risk more."
body: |-
  - Notebookcheck says you can change region in your console's settings, or use an account from another country and a local gift card.
  - The platform's terms warn against circumventing restrictions. Windows Central is cited saying Rockstar is watching for early play.
  - A Twitch partner manager reportedly advised a streamer against showing early-unlock play.
  - This is not Rockstar's position. Rockstar's page says midnight local time everywhere.
