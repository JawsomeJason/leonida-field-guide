id: fast-travel
question: "Is there fast travel, and what is the cheapest way across the map?"
short: "No warp from the map. A ride-hail phone app gets you there for a fee (about $100 extra skips the ride). Buses and trains cost less but run to a schedule."
body: |-
  - GameSpot says the ride-hail app (RydeMe) has to be available to you first, and that it feels pricey early on.
  - Buses and trains cover dozens of stops. The same guide says the network is denser in the main city.
  - One guide's account. Nothing from Rockstar confirms these details.
