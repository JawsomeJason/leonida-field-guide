id: code-regions-ps5
question: "Which countries share a PlayStation code group?"
short: "A PS5 code works only in its own country group. North America is Canada and the United States, and the UK is on its own. Rockstar's page lists every group."
body: |-
  Rockstar's PlayStation groups
  - North America: Canada, United States.
  - United Kingdom: United Kingdom only.
  - Oceania: Australia, New Zealand.
  - Brazil, Japan, South Korea, and Saudi Arabia with the UAE each have their own group. Rockstar says Japanese codes expire 170 days after launch (19 November 2026), which is 8 May 2027.
  - Latin America, the rest of Asia, and the rest of Europe, the Middle East and Africa are separate groups. See Rockstar's page for the country lists.
