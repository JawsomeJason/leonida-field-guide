id: hdr-calibration
question: "How do I set up HDR (extra-bright picture)?"
short: "KeenGamer says to set HDR (a wider range of brightness and colour) to On When Supported, run your console's HDR calibration, then the in-game HDR Calibration."
body: |-
  - KeenGamer says this keeps dark interiors and night streets detailed.
  - Turn off your TV's motion smoothing too. It adds fake frames.
topic: settings
stage: hour-1
tier: none
consoles: all
byConsole:
  ps5: "KeenGamer's guide: set HDR (extra-bright picture) to On When Supported, run Adjust HDR (Settings, Screen and Video, Video Output), then the in-game HDR Calibration in the Display menu."
  xbox-x: "KeenGamer's guide: set HDR (extra-bright picture) to On When Supported, run Calibrate HDR for Games (Settings, General, TV and display options), then the in-game HDR Calibration in the Display menu."
  xbox-s: "KeenGamer's guide: set HDR (extra-bright picture) to On When Supported, run Calibrate HDR for Games (Settings, General, TV and display options), then the in-game HDR Calibration in the Display menu."
