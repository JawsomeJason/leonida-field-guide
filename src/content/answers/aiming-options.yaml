id: aiming-options
question: "Is there auto-aim, and how do I get used to manual aim?"
short: "Targeting has three modes: Lock-On snaps to targets, Partial slows the reticle near enemies (the default), and Free Aim turns aim assist off. Aim Assist Strength runs from 0 to 4."
body: |-
  - A guide's pairing: Partial with a high strength for steady tracking, or Free Aim with strength 0 for raw aiming.
  - Gameplay options include Tap Assist (one press counts as two to four) and Hold Assist, plus hold-to-toggle for actions such as aiming. They cut finger strain in long fights.
